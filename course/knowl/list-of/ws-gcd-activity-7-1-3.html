<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">21</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Bezout’s Identity.</span>
</h2>
<div class="para logical">
<div class="para">Let <span class="process-math">\(a\)</span> and <span class="process-math">\(b\)</span> be integers, not both zero. Then <span class="process-math">\(\gcd(a,b)\)</span> can be written as a linear combination of <span class="process-math">\(a\)</span> and <span class="process-math">\(b\text{.}\)</span> That is, there exist integers <span class="process-math">\(x\)</span> and <span class="process-math">\(y\)</span> such that</div>
<div class="displaymath process-math">
\begin{equation*}
\gcd(a,b) = ax + by.
\end{equation*}
</div>
