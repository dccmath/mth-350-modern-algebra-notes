<div class="para logical">
<div class="para">
<dfn class="terminology">Adding Polynomials</dfn>: The <dfn class="terminology">sum of polynomials</dfn> <span class="process-math">\(p(x)\)</span> and <span class="process-math">\(q(x)\)</span> is defined to be</div>
<div class="displaymath process-math">
\begin{equation*}
p(x) + q(x) = (a_{n}+b_{n})x^{n} + (a_{n-1}+b_{n-1})x^{n-1}+ \cdots + (a_{1}+b_{1}) x + (a_{0}+b_{0}).
\end{equation*}
</div>
